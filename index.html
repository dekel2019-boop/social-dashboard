<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>דשבורד רשתות חברתיות</title>
<link rel="icon" type="image/svg+xml" href="icons/icon.svg">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#ffffff">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Hebrew:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  color-scheme: light;
  --bg: #ffffff;
  --surface: #ffffff;
  --surface-2: #f6f9fe;
  --ink: #0f172a;
  --ink-2: #334155;
  --muted: #475569;
  --border: #e2e8f0;
  --grid: #eef2f7;
  --brand: #1d4ed8;
  --c-tiktok: #2563eb;
  --c-facebook: #059669;
  --c-telegram: #0891b2;
  --accent: #f97316;
  --up: #047857;
  --up-bg: #e7f6ef;
  --down: #b91c1c;
  --down-bg: #fdecec;
  --flat-bg: #f1f5f9;
  --focus: #1d4ed8;
  --shadow: 0 1px 2px rgba(15, 23, 42, 0.05), 0 6px 20px rgba(30, 64, 175, 0.06);
  --topbar: rgba(255, 255, 255, 0.92);
}
:root[data-text="blue"] {
  --ink: #1d4ed8;
  --ink-2: #2563eb;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: "IBM Plex Sans Hebrew", system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
  font-size: 16px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
.num { font-variant-numeric: tabular-nums; }
svg { flex-shrink: 0; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; border-radius: 8px; }

/* top bar */
.topbar {
  position: sticky; top: 0; z-index: 10;
  background: var(--topbar); backdrop-filter: saturate(160%) blur(10px);
  -webkit-backdrop-filter: saturate(160%) blur(10px);
  border-bottom: 1px solid var(--border);
}
.topbar::before {
  content: ""; display: block; height: 3px;
  background: linear-gradient(90deg, var(--c-tiktok) 0 62%, var(--c-facebook) 62% 95%, var(--accent) 95% 100%);
}
.topbar-in {
  max-width: 1040px; margin: 0 auto; padding: 12px 16px;
  display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 12px;
}
.brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
.brand img { width: 36px; height: 36px; border-radius: 10px; }
.brand h1 { margin: 0; font-size: 18px; font-weight: 700; line-height: 1.2; }
.brand p { margin: 0; font-size: 12px; color: var(--muted); }
.live {
  display: inline-flex; align-items: center; gap: 8px; white-space: nowrap;
  font-size: 13px; color: var(--ink-2);
  background: var(--surface); border: 1px solid var(--border); border-radius: 999px; padding: 6px 12px;
}
.actions { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.toggle {
  font: inherit; font-size: 13px; cursor: pointer; min-height: 40px; padding: 0 14px;
  display: inline-flex; align-items: center; gap: 8px; white-space: nowrap;
  border-radius: 999px; border: 1px solid var(--border); background: var(--surface); color: var(--ink-2);
  transition: background-color 160ms ease, border-color 160ms ease;
}
.toggle:hover { border-color: var(--brand); }
.toggle .sw { width: 14px; height: 14px; border-radius: 50%; background: linear-gradient(90deg, #0f172a 50%, #1d4ed8 50%); border: 1px solid var(--border); }
.toggle[aria-pressed="true"] { background: var(--flat-bg); border-color: var(--brand); font-weight: 600; }
.live i { width: 8px; height: 8px; border-radius: 50%; background: var(--up); display: inline-block; }

.wrap { max-width: 1040px; margin: 0 auto; padding: 20px 16px 56px; }

/* tabs */
.tabs {
  display: flex; gap: 4px; padding: 4px; margin-bottom: 20px; max-width: 100%; width: fit-content;
  overflow-x: auto; scrollbar-width: none;
  background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
}
.tabs button {
  font: inherit; font-size: 15px; font-weight: 500; cursor: pointer; min-height: 44px;
  display: inline-flex; align-items: center; gap: 8px;
  padding: 0 16px; border-radius: 9px; border: 0; flex: 0 0 auto; white-space: nowrap; background: transparent; color: var(--ink-2);
  transition: background-color 160ms ease, color 160ms ease;
}
.tabs button:hover { background: var(--surface-2); color: var(--ink); }
.tabs button[aria-selected="true"] { background: var(--brand); color: #fff; }

/* panels */
.panel {
  background: var(--surface); border: 1px solid var(--border); border-radius: 16px;
  box-shadow: var(--shadow); padding: 20px; margin-bottom: 20px;
  animation: rise 260ms ease both;
}
@keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
.panel-head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 16px; margin-bottom: 18px; }
.plat { display: flex; align-items: center; gap: 12px; }
.plat-ico {
  width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center;
  background: color-mix(in srgb, var(--pc) 14%, transparent); color: var(--pc);
}
.plat h2 { margin: 0; font-size: 18px; font-weight: 700; line-height: 1.2; }
.handle { color: var(--muted); font-size: 13px; direction: ltr; unicode-bidi: isolate; display: inline-block; }
.asof { color: var(--muted); font-size: 13px; }

.kpis { display: grid; grid-template-columns: minmax(220px, 280px) 1fr; gap: 16px; }
.hero {
  border-radius: 14px; padding: 18px; background: var(--surface-2); border: 1px solid var(--border);
  display: flex; flex-direction: column; justify-content: center; gap: 6px;
  border-inline-start: 4px solid var(--pc);
}
.hero .label { display: flex; align-items: center; gap: 8px; color: var(--ink-2); font-size: 14px; font-weight: 500; }
.hero .value { font-size: 44px; font-weight: 700; line-height: 1.1; letter-spacing: -0.02em; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; align-content: start; }
.tile { border: 1px solid var(--border); border-radius: 12px; padding: 12px 14px; background: var(--surface); }
.tile .label { display: flex; align-items: center; gap: 6px; color: var(--ink-2); font-size: 13px; }
.tile .value { font-size: 22px; font-weight: 650; margin: 2px 0 6px; line-height: 1.2; }
.ico { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; opacity: 0.85; }

.pill {
  display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 600;
  padding: 2px 8px; border-radius: 999px; background: var(--flat-bg); color: var(--ink-2); width: fit-content;
}
.pill.up { background: var(--up-bg); color: var(--up); }
.pill.down { background: var(--down-bg); color: var(--down); }
.pill { white-space: nowrap; }
.pill.wait { white-space: normal; }
.chg { display: flex; flex-direction: column; align-items: flex-start; gap: 2px; }
.ago { font-size: 12px; color: var(--muted); white-space: nowrap; }

/* chart */
.chart-box { margin-top: 20px; padding-top: 16px; border-top: 1px solid var(--border); }
.chart-head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 10px; }
.chart-head h3 { margin: 0; font-size: 15px; font-weight: 600; }
.chips { display: flex; gap: 6px; overflow-x: auto; max-width: 100%; padding-bottom: 2px; scrollbar-width: thin; }
.chip {
  font: inherit; font-size: 13px; cursor: pointer; white-space: nowrap; min-height: 36px; padding: 0 12px;
  border-radius: 999px; border: 1px solid var(--border); background: var(--surface); color: var(--ink-2);
  transition: background-color 160ms ease, border-color 160ms ease, color 160ms ease;
}
.chip:hover { border-color: var(--pc); color: var(--ink); }
.chip[aria-pressed="true"] { background: color-mix(in srgb, var(--pc) 16%, transparent); border-color: var(--pc); color: var(--ink); font-weight: 600; }
.chart { position: relative; direction: ltr; touch-action: pan-y; border-radius: 8px; }
.chart svg { display: block; width: 100%; height: auto; }
.tip {
  position: absolute; pointer-events: none; z-index: 2; display: none; direction: rtl;
  background: var(--ink); color: var(--bg); border-radius: 10px; padding: 8px 12px; font-size: 12px;
  white-space: nowrap; box-shadow: 0 6px 20px rgba(0, 0, 0, 0.25);
}
.tip b { display: block; font-size: 16px; }
.tip span { opacity: 0.85; }

/* table */
.sub { color: var(--muted); font-size: 13px; margin: 0 0 12px; }
.table-wrap { overflow-x: auto; margin-top: 16px; border: 1px solid var(--border); border-radius: 12px; }
table { border-collapse: separate; border-spacing: 0; width: 100%; font-size: 13px; }
th, td { padding: 10px 14px; text-align: start; white-space: nowrap; border-bottom: 1px solid var(--grid); }
thead th { position: sticky; top: 0; background: var(--surface-2); color: var(--ink-2); font-weight: 600; }
th:first-child, td:first-child { position: sticky; inset-inline-start: 0; background: var(--surface); border-inline-end: 1px solid var(--grid); z-index: 1; }
thead th:first-child { background: var(--surface-2); z-index: 2; }
tbody tr:hover td { background: var(--surface-2); }
tbody tr:last-child td { border-bottom: 0; }
td.d { direction: ltr; text-align: end; font-weight: 600; }
td.d.up { color: var(--up); }
td.d.down { color: var(--down); }
td.d.flat { color: var(--muted); font-weight: 400; }

.callout { background: var(--flat-bg); border-radius: 10px; padding: 10px 14px; color: var(--ink-2); font-size: 14px; }
.view-title { margin: 0 0 14px; font-size: 18px; font-weight: 700; }
.view-title span { font-weight: 400; font-size: 14px; color: var(--muted); margin-inline-start: 8px; }
.note { color: var(--muted); font-size: 14px; padding: 8px 0; }
.empty { text-align: center; padding: 64px 16px; color: var(--ink-2); }
.empty b { display: block; font-size: 20px; color: var(--ink); margin-bottom: 6px; }
footer { color: var(--muted); font-size: 12px; text-align: center; padding: 8px 0 0; }

@media (max-width: 720px) {
  .kpis { grid-template-columns: 1fr; }
  .hero .value { font-size: 38px; }
  .grid { grid-template-columns: repeat(2, 1fr); }
  .panel { padding: 16px; border-radius: 14px; }
  .brand p { display: none; }
  .brand h1 { font-size: 16px; white-space: nowrap; }
  .live { font-size: 12px; padding: 4px 10px; }
  .tabs { width: 100%; }
}
@media (prefers-reduced-motion: reduce) {
  .panel { animation: none; }
  * { transition: none !important; }
}
</style>
</head>
<body>
<header class="topbar">
  <div class="topbar-in">
    <div class="brand">
      <img src="icons/icon.svg" alt="" width="36" height="36">
      <div><h1>דשבורד רשתות חברתיות</h1><p>טיקטוק, פייסבוק וטלגרם במקום אחד</p></div>
    </div>
    <div class="actions">
      <button class="toggle" id="text-toggle" type="button" aria-pressed="false"><span class="sw" aria-hidden="true"></span>טקסט כחול</button>
      <div class="live" id="updated" hidden><i aria-hidden="true"></i><span></span></div>
    </div>
  </div>
</header>

<div class="wrap">
  <div class="tabs" role="tablist" aria-label="תצוגות" id="tablist">
    <button role="tab" id="tab-overview" data-tab="overview" aria-selected="true" aria-controls="view">
      <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 3v18h18M18 17V9M13 17V5M8 17v-3"/></svg>סקירה כללית
    </button>
    <button role="tab" id="tab-day" data-tab="day" aria-selected="false" aria-controls="view" tabindex="-1">
      <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 22a10 10 0 1 0 0-20 10 10 0 0 0 0 20zM12 6v6l4 2"/></svg>שינוי יומי
    </button>
    <button role="tab" id="tab-week" data-tab="week" aria-selected="false" aria-controls="view" tabindex="-1">
      <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 2v4M16 2v4M3 10h18M5 4h14a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z"/></svg>שינוי שבועי
    </button>
    <button role="tab" id="tab-month" data-tab="month" aria-selected="false" aria-controls="view" tabindex="-1">
      <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 2v4M16 2v4M3 10h18M5 4h14a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2zM8 14h.01M12 14h.01M16 14h.01M8 18h.01M12 18h.01"/></svg>שינוי חודשי
    </button>
    <button role="tab" id="tab-year" data-tab="year" aria-selected="false" aria-controls="view" tabindex="-1">
      <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M22 7l-8.5 8.5-5-5L2 17M16 7h6v6"/></svg>שינוי שנתי
    </button>
  </div>
  <main id="view" role="tabpanel" aria-live="polite"></main>
  <footer>הנתונים מתעדכנים אוטומטית כל יום בסביבות 08:00 (שעון ישראל).</footer>
</div>

<script>
const REMOTE = 'https://raw.githubusercontent.com/dekel2019-boop/social-dashboard/main/data/history.json';

const ICONS = {
  followers: 'M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75',
  following: 'M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM19 8v6M22 11h-6',
  likes: 'M19 14c1.5-1.5 3-3.2 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.8 0-3 .5-4.5 2-1.5-1.5-2.7-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4 3 5.5l7 7z',
  video: 'm16 13 5.2 3.5a.5.5 0 0 0 .8-.4V7.9a.5.5 0 0 0-.8-.4L16 11M4 6h10a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2z',
  eye: 'M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12zM12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6z',
  comment: 'M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z',
  share: 'M4 12v7a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-7M16 6l-4-4-4 4M12 2v13',
  save: 'M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z',
  activity: 'M22 12h-4l-3 9L9 3l-3 9H2',
  target: 'M12 22a10 10 0 1 0 0-20 10 10 0 0 0 0 20zM12 18a6 6 0 1 0 0-12 6 6 0 0 0 0 12zM12 14a2 2 0 1 0 0-4 2 2 0 0 0 0 4z',
  doc: 'M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5zM14 2v6h6M8 13h8M8 17h8',
};
const icon = (k) => `<svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="${ICONS[k] || ICONS.activity}"/></svg>`;

const BRAND = {
  tiktok: '<svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M16.5 3c.3 2.2 1.7 3.7 3.8 3.9v3a7 7 0 0 1-3.7-1.2v6.3a5.5 5.5 0 1 1-5.5-5.5c.3 0 .6 0 .9.1v3.1a2.5 2.5 0 1 0 1.6 2.3V3h2.9z"/></svg>',
  facebook: '<svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M14 8h2.6V4.5H14c-2.4 0-4 1.6-4 4V10H7.5v3.5H10V21h3.6v-7.5h2.5l.5-3.5h-3V8.7c0-.5.3-.7.8-.7z"/></svg>',
  telegram: '<svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M21.4 3.6 2.9 10.7c-.9.4-.9 1.1-.2 1.3l4.7 1.5 1.8 5.5c.2.6.4.8.8.8.4 0 .6-.2.9-.5l2.3-2.2 4.7 3.5c.9.5 1.5.2 1.7-.8l3-14.5c.3-1.2-.4-1.8-1.2-1.7zM9 13.3l9.4-5.9c.4-.3.8-.1.5.2l-7.8 7-.3 3.3z"/></svg>',
};

const PLATFORMS = [
  {
    id: 'tiktok', name: 'טיקטוק', handle: '@tiny_hamlazot', color: 'var(--c-tiktok)',
    metrics: [
      ['followers', 'עוקבים', 'followers'], ['following', 'נעקבים', 'following'], ['likes', 'לייקים', 'likes'],
      ['videos', 'סרטונים', 'video'], ['views', 'צפיות (בסרטונים האחרונים)', 'eye'], ['comments', 'תגובות', 'comment'],
      ['shares', 'שיתופים', 'share'], ['saves', 'שמירות', 'save'],
    ],
    neutral: ['following'],
  },
  {
    id: 'facebook', name: 'פייסבוק', handle: '', color: 'var(--c-facebook)',
    metrics: [
      ['followers', 'עוקבים', 'followers'], ['fans', 'לייקים לעמוד', 'likes'], ['reach', 'חשיפה (יום)', 'target'],
      ['views', 'צפיות (יום)', 'eye'], ['engagement', 'אינטראקציות (יום)', 'activity'], ['posts', 'פוסטים אחרונים', 'doc'],
      ['post_reactions', 'ריאקשנים בפוסטים', 'likes'], ['post_comments', 'תגובות בפוסטים', 'comment'], ['post_shares', 'שיתופים בפוסטים', 'share'],
    ],
    neutral: [],
  },
  {
    id: 'telegram', name: 'טלגרם', handle: '@Tiny_Hamlazot', color: 'var(--c-telegram)',
    metrics: [
      ['followers', 'מנויים', 'followers'], ['posts', 'פוסטים אחרונים', 'doc'],
      ['views', 'צפיות (בפוסטים האחרונים)', 'eye'], ['avg_views', 'ממוצע צפיות לפוסט', 'activity'],
      ['photos', 'תמונות בערוץ', 'doc'], ['videos', 'סרטונים בערוץ', 'video'], ['links', 'קישורים בערוץ', 'share'],
    ],
    neutral: [],
  },
];

const nf = new Intl.NumberFormat('he-IL');
const cf = new Intl.NumberFormat('he-IL', { notation: 'compact', maximumFractionDigits: 1 });
const fmt = (n) => nf.format(n);
const shortDate = (d) => d.slice(8, 10) + '/' + d.slice(5, 7);
const longDate = (d) => d.slice(8, 10) + '/' + d.slice(5, 7) + '/' + d.slice(0, 4);

let history = [];
const TABS = ['overview', 'day', 'week', 'month', 'year'];
let tab = 'overview';
try { const t = localStorage.getItem('tab'); if (TABS.includes(t)) tab = t; } catch (e) { /* storage unavailable */ }
const chartMetric = {};

const SOURCES = [
  { url: REMOTE + '?t=' + Date.now() },
  { url: 'https://api.github.com/repos/dekel2019-boop/social-dashboard/contents/data/history.json?ref=main&t=' + Date.now(), headers: { Accept: 'application/vnd.github.raw+json' } },
  { url: 'data/history.json?t=' + Date.now() },
];

// Reads every source and keeps the one with the most recent data, so a stale copy never hides fresh numbers.
async function load() {
  const results = await Promise.all(SOURCES.map(async (s) => {
    try {
      const res = await fetch(s.url, { cache: 'no-store', headers: s.headers });
      if (!res.ok) return null;
      const data = await res.json();
      return Array.isArray(data) ? data : null;
    } catch (e) { return null; }
  }));
  const lastDate = (d) => (d.length ? d[d.length - 1].date : '');
  return results.filter(Boolean).sort((a, b) => lastDate(b).localeCompare(lastDate(a)) || b.length - a.length)[0] || [];
}

function series(pid, key) {
  return history
    .filter((r) => r[pid] && typeof r[pid][key] === 'number')
    .map((r) => ({ d: r.date, v: r[pid][key] }));
}

function lastTwo(pid) {
  const rows = history.filter((r) => r[pid]);
  return { cur: rows[rows.length - 1], prev: rows[rows.length - 2] };
}

function pill(cur, prev, neutral, withLabel) {
  if (prev === undefined || cur === undefined) return '<span class="pill">השוואה מהיום השני</span>';
  const d = cur - prev;
  if (d === 0) return '<span class="pill">ללא שינוי</span>';
  const cls = neutral ? '' : d > 0 ? 'up' : 'down';
  const lbl = withLabel === true ? 'מאתמול' : withLabel;
  const badge = `<span class="pill ${cls}" dir="rtl"><span aria-hidden="true">${d > 0 ? '▲' : '▼'}</span>${d > 0 ? '+' : '−'}${fmt(Math.abs(d))}</span>`;
  return lbl ? `<div class="chg">${badge}<span class="ago">${lbl}</span></div>` : badge;
}

function availableMetrics(p) {
  const latest = history.filter((r) => r[p.id]).pop();
  if (!latest) return [];
  return p.metrics.filter(([k]) => typeof latest[p.id][k] === 'number');
}

function panelHead(p, extra) {
  return `<div class="panel-head"><div class="plat"><span class="plat-ico">${BRAND[p.id]}</span>
    <div><h2>${p.name}</h2>${p.handle ? `<span class="handle">${p.handle}</span>` : ''}</div></div>${extra || ''}</div>`;
}

function overviewCard(p) {
  const metrics = availableMetrics(p);
  const { cur, prev } = lastTwo(p.id);
  const style = `style="--pc:${p.color}"`;
  if (!cur) {
    return `<section class="panel" ${style}>${panelHead(p)}<div class="note">עדיין אין נתונים לפלטפורמה הזו. הם יופיעו אחרי הריצה הראשונה.</div></section>`;
  }
  const [hk, hl, hi] = metrics[0];
  const hero = `<div class="hero"><div class="label">${icon(hi)}${hl}</div>
    <div class="value num">${fmt(cur[p.id][hk])}</div>${pill(cur[p.id][hk], prev ? prev[p.id][hk] : undefined, p.neutral.includes(hk), true)}</div>`;
  const tiles = metrics.slice(1).map(([k, label, ic]) => `
    <div class="tile"><div class="label">${icon(ic)}${label}</div><div class="value num">${fmt(cur[p.id][k])}</div>
    ${pill(cur[p.id][k], prev ? prev[p.id][k] : undefined, p.neutral.includes(k), false)}</div>`).join('');
  const sel = chartMetric[p.id] && metrics.some(([k]) => k === chartMetric[p.id]) ? chartMetric[p.id] : metrics[0][0];
  chartMetric[p.id] = sel;
  const chips = metrics.map(([k, label]) => `<button class="chip" type="button" data-chip="${p.id}" data-k="${k}" aria-pressed="${k === sel}">${label}</button>`).join('');
  return `<section class="panel" data-p="${p.id}" ${style}>
    ${panelHead(p, `<span class="asof">נכון ל-${longDate(cur.date)}</span>`)}
    <div class="kpis">${hero}<div class="grid">${tiles}</div></div>
    <div class="chart-box">
      <div class="chart-head"><h3>מגמה לאורך זמן</h3><div class="chips" role="group" aria-label="בחירת נתון לגרף">${chips}</div></div>
      <div class="chart" id="chart-${p.id}"></div>
    </div></section>`;
}

const PERIODS = {
  day: { days: 1, label: 'יומי', ago: 'מאתמול', cmp: 'מול אתמול', unit: 'תאריך' },
  week: { days: 7, label: 'שבועי', ago: 'משבוע שעבר', cmp: 'מול לפני שבוע', unit: 'שבוע' },
  month: { days: 30, label: 'חודשי', ago: 'מחודש שעבר', cmp: 'מול לפני 30 יום', unit: 'חודש' },
  year: { days: 365, label: 'שנתי', ago: 'משנה שעברה', cmp: 'מול לפני שנה', unit: 'שנה' },
};
let period = 'day';
const DAY = 86400000;
const dayNum = (d) => Math.round(Date.parse(d) / DAY);
const daysText = (n) => (n === 1 ? 'יום אחד' : n + ' ימים');

// Latest record that is at least `days` days older than `cur` (null when the history is too short).
function baselineRow(rows, cur, days) {
  const target = dayNum(cur.date) - days;
  let found = null;
  for (const r of rows) if (dayNum(r.date) <= target) found = r;
  return found;
}

// Calendar bucket of a date: day, week (starts Sunday, as in Israel), month or year.
function bucketKey(d, per) {
  if (per === 'week') return new Date((dayNum(d) - new Date(d + 'T00:00:00Z').getUTCDay()) * DAY).toISOString().slice(0, 10);
  if (per === 'month') return d.slice(0, 7);
  if (per === 'year') return d.slice(0, 4);
  return d;
}
function bucketLabel(key, per) {
  if (per === 'week') return 'שבוע מ-' + shortDate(key);
  if (per === 'month') return key.slice(5) + '/' + key.slice(0, 4);
  if (per === 'year') return key;
  return longDate(key);
}

function dailyCard(p) {
  const metrics = availableMetrics(p);
  const rows = history.filter((r) => r[p.id]);
  const style = `style="--pc:${p.color}"`;
  if (!rows.length) {
    return `<section class="panel" ${style}>${panelHead(p)}<div class="note">עדיין אין נתונים לפלטפורמה הזו.</div></section>`;
  }
  const P = PERIODS[period];
  const cur = rows[rows.length - 1];
  const base = baselineRow(rows, cur, P.days);
  const missing = P.days - (dayNum(cur.date) - dayNum(rows[0].date));
  const availDate = new Date((dayNum(cur.date) + missing) * DAY).toISOString().slice(0, 10);
  const tiles = metrics.map(([k, label, ic]) => `
    <div class="tile"><div class="label">${icon(ic)}${label}</div><div class="value num">${fmt(cur[p.id][k])}</div>
    ${base ? pill(cur[p.id][k], base[p.id][k], p.neutral.includes(k), P.ago) : ''}</div>`).join('');
  const sub = base
    ? `השוואה: ${longDate(cur.date)} מול ${longDate(base.date)}`
    : `השינוי ה${P.label} עוד לא זמין: הוא יופיע ב-${longDate(availDate)} (בעוד ${daysText(missing)}), כשיהיו מספיק נתונים להשוואה. עד אז אלה המספרים הנוכחיים.`;

  const buckets = [];
  for (const r of rows) {
    const key = bucketKey(r.date, period);
    if (buckets.length && buckets[buckets.length - 1].key === key) buckets[buckets.length - 1].row = r;
    else buckets.push({ key, row: r });
  }
  let table;
  if (buckets.length < 2) {
    table = `<div class="note">אין עדיין תקופה להשוואה. הטבלה תתמלא כשתהיה לפחות תקופה אחת שהסתיימה.</div>`;
  } else {
    const heads = metrics.map(([, label]) => `<th>${label}</th>`).join('');
    const body = buckets.slice(1).map((bk, i) => {
      const before = buckets[i].row;
      const cells = metrics.map(([k]) => {
        const a = bk.row[p.id][k], b = before[p.id][k];
        if (typeof a !== 'number' || typeof b !== 'number') return '<td class="d flat num">–</td>';
        const d = a - b;
        if (d === 0) return '<td class="d flat num">0</td>';
        const cls = p.neutral.includes(k) ? 'flat' : d > 0 ? 'up' : 'down';
        return `<td class="d ${cls} num">${d > 0 ? '+' : '−'}${fmt(Math.abs(d))}</td>`;
      }).join('');
      const open = period !== 'day' && i === buckets.length - 2 ? ' (עד היום)' : '';
      return `<tr><td>${bucketLabel(bk.key, period)}${open}</td>${cells}</tr>`;
    }).reverse();
    const shown = body.slice(0, 60).join('');
    const more = body.length > 60 ? `<p class="sub" style="margin:8px 0 0">מוצגות ${P.unit === 'תאריך' ? '60 הימים' : '60 התקופות'} האחרונים.</p>` : '';
    table = `<div class="table-wrap"><table><thead><tr><th>${P.unit}</th>${heads}</tr></thead><tbody>${shown}</tbody></table></div>${more}`;
  }
  return `<section class="panel" ${style}>${panelHead(p)}
    <p class="sub${base ? '' : ' callout'}">${sub}</p>
    <div class="grid">${tiles}</div>
    ${table}
  </section>`;
}

const hi0 = (pts) => Math.max(...pts.map((x) => x.v));

function drawChart(p) {
  const el = document.getElementById('chart-' + p.id);
  if (!el) return;
  const key = chartMetric[p.id];
  const label = (p.metrics.find(([k]) => k === key) || [, key])[1];
  const pts = series(p.id, key);
  if (pts.length < 2) {
    el.innerHTML = '<div class="note" style="direction:rtl">הגרף יופיע אחרי שיהיו נתונים משני ימים לפחות.</div>';
    return;
  }
  const W = Math.max(280, Math.round(el.clientWidth || 640)), H = W < 480 ? 210 : 240, L = hi0(pts) >= 10000 ? 48 : 40, R = 16, T = 16, B = 30;
  let lo = Math.min(...pts.map((x) => x.v)), hi = Math.max(...pts.map((x) => x.v));
  if (lo === hi) { lo -= 1; hi += 1; }
  const pad = (hi - lo) * 0.12; lo -= pad; hi += pad;
  const t0 = Date.parse(pts[0].d), t1 = Date.parse(pts[pts.length - 1].d);
  const X = (d) => L + ((Date.parse(d) - t0) / (t1 - t0 || 1)) * (W - L - R);
  const Y = (v) => T + (1 - (v - lo) / (hi - lo)) * (H - T - B);
  const ticks = [0, 1, 2, 3].map((i) => lo + ((hi - lo) * i) / 3);
  const grid = ticks.map((v) => `<line x1="${L}" x2="${W - R}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--grid)" stroke-width="1"/>
    <text x="${L - 8}" y="${Y(v) + 4}" text-anchor="end" font-size="11" fill="var(--muted)">${(hi >= 10000 ? cf : nf).format(Math.round(v))}</text>`).join('');
  const mid = pts[Math.floor(pts.length / 2)];
  const xl = [pts[0], mid, pts[pts.length - 1]].filter((x, i, a) => a.findIndex((y) => y.d === x.d) === i)
    .map((x, i, a) => `<text x="${X(x.d)}" y="${H - 8}" text-anchor="${i === 0 ? 'start' : i === a.length - 1 ? 'end' : 'middle'}" font-size="11" fill="var(--muted)">${shortDate(x.d)}</text>`).join('');
  const line = pts.map((x, i) => (i ? 'L' : 'M') + X(x.d).toFixed(1) + ' ' + Y(x.v).toFixed(1)).join(' ');
  const area = line + ` L${X(pts[pts.length - 1].d).toFixed(1)} ${H - B} L${X(pts[0].d).toFixed(1)} ${H - B} Z`;
  const last = pts[pts.length - 1];
  el.setAttribute('tabindex', '0');
  el.setAttribute('role', 'img');
  el.setAttribute('aria-label', `גרף ${label}: מ-${fmt(pts[0].v)} ב-${longDate(pts[0].d)} עד ${fmt(last.v)} ב-${longDate(last.d)}. אפשר לעבור בין הנקודות עם חיצים.`);
  el.innerHTML = `<svg viewBox="0 0 ${W} ${H}" aria-hidden="true">
    <defs><linearGradient id="g-${p.id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${p.color}" stop-opacity="0.22"/><stop offset="1" stop-color="${p.color}" stop-opacity="0"/></linearGradient></defs>
    ${grid}<line x1="${L}" x2="${W - R}" y1="${H - B}" y2="${H - B}" stroke="var(--border)"/>${xl}
    <path d="${area}" fill="url(#g-${p.id})"/>
    <path d="${line}" fill="none" stroke="${p.color}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="${X(last.d)}" cy="${Y(last.v)}" r="4.5" fill="${p.color}" stroke="var(--surface)" stroke-width="2"/>
    <line class="xh" y1="${T}" y2="${H - B}" stroke="var(--muted)" stroke-width="1" stroke-dasharray="3 3" style="display:none"/>
    <circle class="dh" r="6" fill="${p.color}" stroke="var(--surface)" stroke-width="2.5" style="display:none"/>
  </svg><div class="tip" role="presentation"></div>`;
  const svg = el.querySelector('svg'), tip = el.querySelector('.tip');
  const xh = svg.querySelector('.xh'), dh = svg.querySelector('.dh');
  const show = (i) => {
    const best = pts[i], before = pts[i - 1];
    const r = svg.getBoundingClientRect();
    xh.setAttribute('x1', X(best.d)); xh.setAttribute('x2', X(best.d)); xh.style.display = '';
    dh.setAttribute('cx', X(best.d)); dh.setAttribute('cy', Y(best.v)); dh.style.display = '';
    const diff = before ? best.v - before.v : null;
    tip.innerHTML = `<span>${longDate(best.d)}</span><b class="num">${fmt(best.v)}</b><span>${label}${diff === null ? '' : ` · ${diff > 0 ? '+' : diff < 0 ? '−' : ''}${fmt(Math.abs(diff))} מיום קודם`}</span>`;
    tip.style.display = 'block';
    const px = (X(best.d) / W) * r.width;
    const w = tip.offsetWidth;
    tip.style.left = Math.max(0, Math.min(r.width - w, px - w / 2)) + 'px';
    tip.style.top = Math.max(0, (Y(best.v) / H) * r.height - tip.offsetHeight - 12) + 'px';
  };
  const hide = () => { tip.style.display = 'none'; xh.style.display = 'none'; dh.style.display = 'none'; };
  const nearest = (ev) => {
    const r = svg.getBoundingClientRect();
    const vx = ((ev.clientX - r.left) / r.width) * W;
    let bi = 0;
    pts.forEach((x, i) => { if (Math.abs(X(x.d) - vx) < Math.abs(X(pts[bi].d) - vx)) bi = i; });
    return bi;
  };
  let cur = pts.length - 1;
  svg.addEventListener('pointermove', (ev) => { cur = nearest(ev); show(cur); });
  svg.addEventListener('pointerdown', (ev) => { cur = nearest(ev); show(cur); });
  svg.addEventListener('pointerleave', hide);
  el.addEventListener('keydown', (ev) => {
    if (ev.key === 'ArrowLeft') cur = Math.max(0, cur - 1);
    else if (ev.key === 'ArrowRight') cur = Math.min(pts.length - 1, cur + 1);
    else if (ev.key === 'Escape') return hide();
    else return;
    ev.preventDefault();
    show(cur);
  });
  el.addEventListener('blur', hide);
}

function render() {
  const view = document.getElementById('view');
  TABS.forEach((k) => {
    const b = document.getElementById('tab-' + k);
    b.setAttribute('aria-selected', String(k === tab));
    b.tabIndex = k === tab ? 0 : -1;
  });
  if (tab !== 'overview') period = tab;
  if (!history.length) {
    view.innerHTML = '<div class="empty"><b>עדיין אין נתונים</b>הדשבורד יתמלא אחרי הריצה היומית הראשונה.</div>';
    return;
  }
  const title = tab === 'overview' ? '' : `<h2 class="view-title">שינוי ${PERIODS[period].label}<span>${PERIODS[period].cmp}</span></h2>`;
  view.innerHTML = title + PLATFORMS.map(tab === 'overview' ? overviewCard : dailyCard).join('');
  if (tab === 'overview') {
    PLATFORMS.forEach(drawChart);
    view.querySelectorAll('button[data-chip]').forEach((b) => b.addEventListener('click', () => {
      const p = PLATFORMS.find((x) => x.id === b.dataset.chip);
      chartMetric[p.id] = b.dataset.k;
      view.querySelectorAll(`button[data-chip="${p.id}"]`).forEach((c) => c.setAttribute('aria-pressed', c === b));
      drawChart(p);
    }));
  }
}

const textToggle = document.getElementById('text-toggle');
function setTextTheme(blue, save) {
  if (blue) document.documentElement.dataset.text = 'blue'; else delete document.documentElement.dataset.text;
  textToggle.setAttribute('aria-pressed', String(blue));
  if (save) { try { localStorage.setItem('text-theme', blue ? 'blue' : 'black'); } catch (e) { /* storage unavailable */ } }
}
try { if (localStorage.getItem('text-theme') === 'blue') setTextTheme(true, false); } catch (e) { /* storage unavailable */ }
textToggle.addEventListener('click', () => setTextTheme(textToggle.getAttribute('aria-pressed') !== 'true', true));

let rz;
window.addEventListener('resize', () => {
  clearTimeout(rz);
  rz = setTimeout(() => { if (tab === 'overview') PLATFORMS.forEach(drawChart); }, 150);
});

function selectTab(k, focus) {
  tab = k;
  try { localStorage.setItem('tab', k); } catch (e) { /* storage unavailable */ }
  render();
  const b = document.getElementById('tab-' + k);
  if (focus) b.focus();
  b.scrollIntoView({ block: 'nearest', inline: 'nearest' });
}
TABS.forEach((k) => document.getElementById('tab-' + k).addEventListener('click', () => selectTab(k, false)));
document.getElementById('tablist').addEventListener('keydown', (ev) => {
  const i = TABS.indexOf(tab);
  // the page is right-to-left, so ArrowLeft moves to the next tab
  const next = ev.key === 'ArrowLeft' ? (i + 1) % TABS.length : ev.key === 'ArrowRight' ? (i + TABS.length - 1) % TABS.length : ev.key === 'Home' ? 0 : ev.key === 'End' ? TABS.length - 1 : -1;
  if (next < 0) return;
  ev.preventDefault();
  selectTab(TABS[next], true);
});

load().then((data) => {
  history = data.slice().sort((a, b) => a.date.localeCompare(b.date));
  const last = history[history.length - 1];
  if (last) {
    const u = document.getElementById('updated');
    u.querySelector('span').textContent = 'עדכון אחרון: ' + longDate(last.date);
    u.hidden = false;
  }
  render();
});
</script>
</body>
</html>
